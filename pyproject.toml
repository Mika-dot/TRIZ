[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "triz-llm-agent"
version = "1.1.0"
description = "TRIZ/FSA/ARIZ pipeline for engineering and small-language-model architecture optimization"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "requests>=2.31.0",
  "Flask>=3.0.0"
]

[project.scripts]
triz-agent = "triz_agent.cli:main"
triz-agent-web = "triz_agent.webapp:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
